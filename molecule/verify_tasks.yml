---
# The role is not included in this playbook, so its defaults are not in
# scope. Reading defaults/main.yml directly ties the version assertion
# below.
- name: Load the role defaults
  ansible.builtin.include_vars:
    file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
    name: neko_defaults

- name: Wait for the Neko systemd services to become active (up to 180s each)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  register: neko_services
  until: neko_services.status.ActiveState == 'active'
  retries: 36
  delay: 5
  loop: "{{ neko_verify_units }}"
  # So that giving up is reported by the assertion below rather than as a
  # wall of systemd unit properties.
  failed_when: false

# `Restart=always` in the systemd unit means that even a container which crashes
# and gets restarted reads as active here, so this is a precondition rather than
# a result.
- name: Assert the Neko systemd services are active
  ansible.builtin.assert:
    that: neko_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
    fail_msg: >-
      Not every service is active:
      {{ dict(neko_verify_units | zip(neko_services.results | map(attribute='status.ActiveState'))) }}
    success_msg: "Every systemd service is active"

- name: Retrieve the Neko systemd services log for debugging
  when: neko_debug_service_enabled | bool
  ansible.builtin.command:
    cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
  changed_when: false
  loop: "{{ neko_verify_units }}"

############################################################################
# The port the role was told to use, not the one baked into the image
############################################################################

- name: Wait for Neko to report itself healthy (up to 180s)
  ansible.builtin.uri:
    url: "{{ neko_base_url }}/health"
    method: GET
    status_code: [200]
    follow_redirects: none
    return_content: true
  register: neko_health
  until: neko_health.status == 200 and neko_health.content | trim == 'true'
  retries: 36
  delay: 5
  # So that giving up is reported by the assertion below rather than as a
  # wall of systemd unit properties.
  failed_when: false

- name: Assert Neko reports itself healthy
  ansible.builtin.assert:
    that: neko_health.content | trim == 'true'
    fail_msg: "Neko did not report itself healthy: {{ neko_health.content | default('no response') }}"
    success_msg: "Neko reports itself healthy"

- name: Inspect the Neko container
  ansible.builtin.command:
    cmd: docker container inspect neko
  register: neko_container_raw
  changed_when: false
