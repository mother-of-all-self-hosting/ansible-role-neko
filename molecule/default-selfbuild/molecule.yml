---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: neko-${MOLECULE_DISTRO:-ubuntu2604}-default-selfbuild
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        neko_debug_service_enabled: false

        # Variables for Neko
        neko_uid: 1000
        neko_gid: 1000
        neko_hostname: localhost
        neko_container_labels_traefik_enabled: false

        # Test self-building
        neko_container_image_self_build: true

        # See the note in the `default` scenario: this is not Neko's built-in bind port.
        neko_container_http_port: 8099
        neko_container_http_host_bind_port: 8099

        neko_environment_variables_neko_member_multiuser_user_password: molecule-user-4f2a
        neko_environment_variables_neko_member_multiuser_admin_password: molecule-admin-9c71

        # The mirror image of the `default` scenario, which leaves this off and asserts
        # that /metrics is gone. Turning it on here asserts the other direction, so that
        # the pair proves the role's value reaches Neko rather than one of them agreeing
        # with a Neko default by accident.
        neko_container_labels_traefik_metrics_enabled: true
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
