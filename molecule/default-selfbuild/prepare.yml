---
- name: Prepare Neko Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Neko Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Neko Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
          # Lets the inner Docker daemon use fuse-overlayfs (see below).
          - fuse-overlayfs
        state: present

    - name: Ensure Docker is installed for Neko Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          # Neko's images are large - the published firefox image alone is over half a
          # gigabyte spread across 25 layers, and the self-build scenario stacks another
          # image on top of it. `vfs` makes a full copy of the filesystem for every one of
          # those layers, which multiplies that into tens of gigabytes; `overlay2` cannot
          # be nested inside this container. fuse-overlayfs can, and stores each layer once.
          storage-driver: fuse-overlayfs
